aid: scalearc-ignitetech
name: ScaleArc (IgniteTech)
description: 'ScaleArc is database load balancing software that delivers continuous
  availability and high performance for SQL Server and MySQL databases. It sits transparently
  between applications and databases to automate failover, split and balance read/write
  traffic, pool connections, and cache queries with no application code changes, supporting
  on-premise, cloud, and database-as-a-service deployments such as Amazon RDS and Azure
  SQL. Originally an independent product, ScaleArc is now owned and supported by IgniteTech
  (part of ESW Capital Group) and offered through its enterprise software library. It
  was surfaced as a portfolio company of bain-capital-ventures. There is no public developer
  portal, API reference, SDK, or downloadable spec surface for ScaleArc today; access,
  licensing, and support are handled directly through IgniteTech.'
